<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Campus Master Lab IA — Multijugador</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%231E1EFF' d='M32 4c2.6 9.4 8.6 15.4 18 18-9.4 2.6-15.4 8.6-18 18-2.6-9.4-8.6-15.4-18-18 9.4-2.6 15.4-8.6 18-18z'/%3E%3C/svg%3E">
<style>
  :root {
    --ml-blue: #1E1EFF;
    --ml-ink: #0A0A23;
    --ml-mist: #F4F4FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--ml-ink);
    overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    touch-action: none;
  }
  #game-container { width: 100%; height: 100%; }

  /* ---------- Overlay de bienvenida ---------- */
  #welcome {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, rgba(30,30,255,.25), transparent 60%), var(--ml-ink);
  }
  .card {
    width: min(440px, calc(100vw - 40px));
    background: rgba(244,244,255,.04);
    border: 1px solid rgba(244,244,255,.15);
    border-radius: 16px;
    padding: 36px 32px;
    text-align: center;
    color: var(--ml-mist);
    backdrop-filter: blur(6px);
  }
  .spark {
    width: 54px; height: 54px; margin: 0 auto 18px;
    color: var(--ml-blue);
    filter: drop-shadow(0 0 14px rgba(30,30,255,.8));
  }
  .card h1 { font-size: 22px; letter-spacing: .12em; font-weight: 800; }
  .card h1 .lab { color: var(--ml-blue); font-style: italic; }
  .card p.sub { margin: 6px 0 22px; font-size: 13px; opacity: .65; }
  .card input {
    width: 100%; padding: 12px 16px;
    border-radius: 10px; border: 1px solid rgba(244,244,255,.25);
    background: rgba(10,10,35,.6); color: var(--ml-mist);
    font-size: 15px; text-align: center; outline: none;
  }
  .card input:focus { border-color: var(--ml-blue); box-shadow: 0 0 0 4px rgba(30,30,255,.18); }
  .card button {
    margin-top: 14px; width: 100%; padding: 13px;
    border: none; border-radius: 10px; cursor: pointer;
    background: var(--ml-blue); color: white;
    font-size: 15px; font-weight: 700; letter-spacing: .04em;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 6px 24px rgba(30,30,255,.4);
  }
  .card button:hover { transform: translateY(-1px); box-shadow: 0 10px 32px rgba(30,30,255,.55); }
  .hints { margin-top: 20px; font-size: 12px; opacity: .55; line-height: 1.7; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 5;
    display: none; align-items: center; gap: 10px;
    background: rgba(10,10,35,.72);
    border: 1px solid rgba(244,244,255,.18);
    border-radius: 999px;
    padding: 8px 18px 8px 10px;
    color: var(--ml-mist); font-weight: 800; font-size: 18px;
    backdrop-filter: blur(4px);
  }
  #hud img { width: 30px; height: 30px; }
  #online-badge {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: none; align-items: center; gap: 7px;
    background: rgba(10,10,35,.72);
    border: 1px solid rgba(244,244,255,.18);
    border-radius: 999px; padding: 7px 14px;
    color: var(--ml-mist); font-size: 12px; font-weight: 600;
    backdrop-filter: blur(4px);
  }
  #online-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #35d07f; }
  #online-badge.offline .dot { background: #999; }
  #brand {
    position: fixed; top: 16px; right: 16px; z-index: 5;
    display: none; color: var(--ml-mist);
    font-size: 11px; letter-spacing: .18em; font-weight: 700; opacity: .55;
  }
  #brand .lab { color: var(--ml-blue); font-style: italic; }

  /* ---------- Chat ---------- */
  #chat-bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 5; display: none; align-items: center; gap: 8px;
    width: min(480px, calc(100vw - 32px));
  }
  #chat-input {
    flex: 1; padding: 11px 16px;
    border-radius: 999px; border: 1px solid rgba(244,244,255,.22);
    background: rgba(10,10,35,.78); color: var(--ml-mist);
    font-size: 14px; outline: none;
    backdrop-filter: blur(4px);
  }
  #chat-input:focus { border-color: var(--ml-blue); box-shadow: 0 0 0 4px rgba(30,30,255,.18); }
  #chat-send {
    padding: 11px 18px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--ml-blue); color: white; font-weight: 700; font-size: 14px;
  }
</style>
</head>
<body>
<div id="game-container"></div>

<div id="hud"><img src="assets/coin.png" alt="moneda"><span id="coin-count">0</span></div>
<div id="online-badge"><span class="dot"></span><span id="online-text">Conectando…</span></div>
<div id="brand">MASTER<span class="lab">LAB</span> IA</div>

<div id="chat-bar">
  <input id="chat-input" type="text" maxlength="120" placeholder="Escribe para hablar con quien tengas cerca… (Enter)" autocomplete="off">
  <button id="chat-send">💬</button>
</div>

<div id="welcome">
  <div class="card">
    <svg class="spark" viewBox="0 0 64 64" fill="currentColor">
      <path d="M32 4c2.6 9.4 8.6 15.4 18 18-9.4 2.6-15.4 8.6-18 18-2.6-9.4-8.6-15.4-18-18 9.4-2.6 15.4-8.6 18-18z"/>
      <circle cx="52" cy="14" r="3.2"/>
    </svg>
    <h1>CAMPUS MASTER<span class="lab">LAB</span> IA</h1>
    <p class="sub">Fase 2 — Plaza Central multijugador</p>
    <input id="player-name" type="text" maxlength="14" placeholder="Tu nombre de científic@" autocomplete="off">
    <button id="enter-btn">Entrar al laboratorio ⚡</button>
    <div class="hints">
      🖱️ / 👆 Toca el piso para caminar &nbsp;·&nbsp; ⌨️ WASD o flechas<br>
      💬 Chat de proximidad: solo te leen los que están cerca<br>
      🪙 Recoge las monedas Spark de la plaza
    </div>
  </div>
</div>

<script src="phaser.min.js"></script>
<script src="colyseus.js"></script>
<script>
"use strict";

/* ============================================================
   Campus Master Lab IA — Fase 2: multijugador
   Cliente Phaser + Colyseus. Si el servidor no responde,
   cae a modo offline (single-player) automáticamente.
   ============================================================ */

const WORLD_W = 1920;
const WORLD_H = 1085;

// Área caminable: elipse de la plaza menos la fuente (espejo del servidor).
const FLOOR_CX = 950, FLOOR_CY = 610, FLOOR_RX = 590, FLOOR_RY = 370;
const FOUNTAIN = { x: 945, y: 575, r: 185 };

function isWalkable(x, y) {
  const dx = (x - FLOOR_CX) / FLOOR_RX;
  const dy = (y - FLOOR_CY) / FLOOR_RY;
  if (dx * dx + dy * dy > 1) return false;
  return Math.hypot(x - FOUNTAIN.x, y - FOUNTAIN.y) > FOUNTAIN.r;
}

function randomFloorPoint() {
  for (let i = 0; i < 200; i++) {
    const x = FLOOR_CX - FLOOR_RX + Math.random() * FLOOR_RX * 2;
    const y = FLOOR_CY - FLOOR_RY + Math.random() * FLOOR_RY * 2;
    if (isWalkable(x, y)) return { x, y };
  }
  return { x: 960, y: 880 };
}

const SPEED = 340;             // px/s
const PICKUP_DIST = 55;
const CHAT_RADIUS = 360;       // px de proximidad para leer el chat
const MOVE_SEND_MS = 60;       // frecuencia de envío de posición
const OFFLINE_COINS = 6;

let playerName = "Científic@";

function depthScaleFor(y) {
  const t = (y - (FLOOR_CY - FLOOR_RY)) / (FLOOR_RY * 2);
  return 0.68 + Math.max(0, Math.min(1, t)) * 0.42;
}

class PlazaScene extends Phaser.Scene {
  constructor() { super("plaza"); }

  preload() {
    this.load.image("plaza", "assets/plaza.jpg");
    this.load.image("player-down", "assets/player-down.png");
    this.load.image("player-up", "assets/player-up.png");
    this.load.image("player-side", "assets/player-side.png");
    this.load.image("coin", "assets/coin.png");
  }

  create() {
    this.add.image(0, 0, "plaza").setOrigin(0);

    // --- Jugador local ---
    const spawn = randomFloorPoint();
    this.me = this.makeAvatar(spawn.x, spawn.y, playerName, true);
    this.target = null;
    this.moving = false;
    this.bobT = 0;
    this.idleT = 0;
    this.leanDir = 0;
    this.lastSent = 0;
    this.lastSentState = "";

    // --- Multijugador ---
    this.room = null;
    this.online = false;
    this.remotes = new Map();   // sessionId -> avatar
    this.coinSprites = new Map(); // coinId -> sprite
    this.score = 0;
    this.connect();

    // --- Offline fallback (se activa solo si el server no responde) ---
    this.offlineCoins = [];

    // --- Input ---
    this.input.on("pointerdown", (p) => {
      if (document.activeElement === chatInput) chatInput.blur();
      const wp = this.cameras.main.getWorldPoint(p.x, p.y);
      if (isWalkable(wp.x, wp.y)) {
        this.target = { x: wp.x, y: wp.y };
        this.marker(wp.x, wp.y);
      }
    });
    this.keys = this.input.keyboard.addKeys("W,A,S,D,UP,LEFT,DOWN,RIGHT");

    window.__plaza = this; // hook para pruebas automatizadas

    // --- Cámara ---
    this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
    this.fitCamera();
    this.scale.on("resize", () => this.fitCamera());
  }

  // ---------- Conexión ----------
  async connect() {
    const badge = document.getElementById("online-badge");
    const btext = document.getElementById("online-text");
    try {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const client = new Colyseus.Client(`${proto}://${location.hostname}:2567`);
      this.room = await client.joinOrCreate("plaza", { name: playerName });
      this.online = true;
      badge.classList.remove("offline");

      // Posición inicial que nos asignó el servidor
      const meState = this.room.state.players.get(this.room.sessionId);
      if (meState) this.placeAvatar(this.me, meState.x, meState.y);

      this.room.onMessage("chat", ({ id, text }) => this.onChat(id, text));
      this.room.onMessage("collected", ({ id, by }) => {
        const s = this.coinSprites.get(id);
        if (s) {
          this.collectFx(s, by === this.room.sessionId);
          this.coinSprites.delete(id);
        }
      });
      this.room.onLeave(() => {
        this.online = false;
        badge.classList.add("offline");
        btext.textContent = "Desconectado";
      });
    } catch (e) {
      this.online = false;
      badge.classList.add("offline");
      btext.textContent = "Modo offline";
      for (let i = 0; i < OFFLINE_COINS; i++) this.spawnOfflineCoin();
    }
  }

  // ---------- Avatares ----------
  makeAvatar(x, y, name, isMe) {
    const shadow = this.add.ellipse(x, y - 4, 92, 30, 0x0A0A23, 0.32);
    const sprite = this.add.image(x, y, "player-down").setOrigin(0.5, 0.94);
    const tag = this.add.text(x, y, name, {
      fontFamily: "ui-sans-serif, system-ui, sans-serif",
      fontSize: "22px", fontStyle: "bold",
      color: isMe ? "#FFD84D" : "#F4F4FF",
      stroke: "#0A0A23", strokeThickness: 5,
    }).setOrigin(0.5, 1);
    return {
      sprite, shadow, tag,
      x, y,            // posición lógica (pies)
      tx: x, ty: y,    // objetivo de interpolación (remotos)
      flip: false, moving: false, dir: "down",
      bobT: 0, idleT: Math.random() * 10,
      bubble: null, bubbleTimer: null,
    };
  }

  placeAvatar(a, x, y) { a.x = x; a.y = y; a.tx = x; a.ty = y; }

  destroyAvatar(a) {
    a.sprite.destroy(); a.shadow.destroy(); a.tag.destroy();
    if (a.bubble) a.bubble.destroy();
  }

  renderAvatar(a, dt) {
    const ds = depthScaleFor(a.y);
    // Vista según dirección: frente / espalda / perfil (flip para izquierda)
    const tex = a.dir === "up" ? "player-up" : a.dir === "side" ? "player-side" : "player-down";
    if (a.sprite.texture.key !== tex) a.sprite.setTexture(tex);
    const flip = a.dir === "side" ? a.flip : false;
    if (a.moving) {
      a.bobT += dt * 0.022;
      const bob = Math.abs(Math.sin(a.bobT));
      a.sprite.y = a.y - bob * 7;
      a.sprite.angle = Math.sin(a.bobT) * 3 + (a.dir === "side" ? (flip ? -2.5 : 2.5) : 0);
      a.sprite.scaleY = ds * (1 + bob * 0.045);
      a.sprite.scaleX = (flip ? -1 : 1) * ds * (1 - bob * 0.03);
      a.shadow.setScale(1 - bob * 0.12);
    } else {
      a.idleT += dt * 0.004;
      a.sprite.y = a.y;
      a.sprite.angle = 0;
      a.sprite.scaleY = ds * (1 + Math.sin(a.idleT) * 0.012);
      a.sprite.scaleX = (flip ? -1 : 1) * ds;
      a.shadow.setScale(1);
      a.bobT = 0;
    }
    a.sprite.flipX = false; // el flip va vía scaleX
    a.sprite.x = a.x;
    a.shadow.setPosition(a.x, a.y - 4);
    a.sprite.setDepth(a.y);
    a.shadow.setDepth(a.y - 1);
    a.tag.setDepth(a.y + 1);
    a.tag.setPosition(a.x, a.sprite.y - a.sprite.displayHeight - 6);
    if (a.bubble) {
      a.bubble.setDepth(a.y + 2);
      a.bubble.setPosition(a.x, a.tag.y - 30);
    }
  }

  // ---------- Chat ----------
  onChat(id, text) {
    const isMe = this.room && id === this.room.sessionId;
    const a = isMe ? this.me : this.remotes.get(id);
    if (!a) return;
    // Proximidad: solo se lee a quien está cerca
    if (!isMe && Math.hypot(a.x - this.me.x, a.y - this.me.y) > CHAT_RADIUS) return;

    if (a.bubble) { a.bubble.destroy(); a.bubble = null; }
    if (a.bubbleTimer) a.bubbleTimer.remove();

    const bubble = this.add.text(a.x, a.y - 200, text, {
      fontFamily: "ui-sans-serif, system-ui, sans-serif",
      fontSize: "19px",
      color: "#0A0A23",
      backgroundColor: "#F4F4FF",
      padding: { x: 12, y: 7 },
      wordWrap: { width: 300 },
      align: "center",
    }).setOrigin(0.5, 1);
    a.bubble = bubble;
    a.bubbleTimer = this.time.delayedCall(4200, () => {
      if (a.bubble === bubble) { bubble.destroy(); a.bubble = null; }
    });
  }

  sendChat(text) {
    const t = text.trim();
    if (!t) return;
    if (this.online && this.room) {
      this.room.send("chat", { text: t });
    } else {
      this.onChatLocal(t);
    }
  }

  onChatLocal(text) {
    // Burbujita en modo offline
    if (this.room) return;
    this.onChat("__me__", text);
  }

  // ---------- Monedas ----------
  spawnOfflineCoin() {
    const { x, y } = randomFloorPoint();
    const s = this.add.image(x, y, "coin").setScale(0.85);
    s.baseY = y;
    s.phase = Math.random() * Math.PI * 2;
    this.offlineCoins.push(s);
  }

  makeCoinSprite(x, y) {
    const s = this.add.image(x, y, "coin").setScale(0.85);
    s.baseY = y;
    s.phase = Math.random() * Math.PI * 2;
    s.setDepth(y);
    return s;
  }

  collectFx(coinSprite, byMe) {
    const plus = this.add.text(coinSprite.x, coinSprite.baseY - 40, "+1", {
      fontSize: "30px", fontStyle: "bold", color: "#FFD84D",
      stroke: "#0A0A23", strokeThickness: 6,
    }).setOrigin(0.5).setDepth(99999);
    this.tweens.add({
      targets: plus, y: coinSprite.baseY - 110, alpha: 0, duration: 650,
      onComplete: () => plus.destroy(),
    });
    this.tweens.add({
      targets: coinSprite, y: coinSprite.baseY - 40, alpha: 0, scale: 1.1, duration: 260,
      onComplete: () => coinSprite.destroy(),
    });
    if (byMe) {
      this.score++;
      document.getElementById("coin-count").textContent = this.score;
    }
  }

  marker(x, y) {
    // Pulso inicial
    const c = this.add.circle(x, y, 16).setStrokeStyle(3, 0x1E1EFF, 1).setDepth(99998);
    this.tweens.add({
      targets: c, scale: 0.2, alpha: 0, duration: 420,
      onComplete: () => c.destroy(),
    });
    // Anillo persistente que respira hasta llegar al destino
    if (this.destMarker) { this.destMarker.destroy(); this.destMarker = null; }
    const ring = this.add.ellipse(x, y, 34, 16).setStrokeStyle(2.5, 0x1E1EFF, 0.9).setDepth(2);
    this.destMarker = ring;
    this.tweens.add({
      targets: ring, scaleX: 1.25, scaleY: 1.25, alpha: 0.45,
      duration: 520, yoyo: true, repeat: -1, ease: "sine.inOut",
    });
  }

  clearDestMarker() {
    if (this.destMarker) { this.destMarker.destroy(); this.destMarker = null; }
  }

  fitCamera() {
    const cam = this.cameras.main;
    const zx = this.scale.width / WORLD_W;
    const zy = this.scale.height / WORLD_H;
    cam.setZoom(Math.max(zx, zy));
    cam.centerOn(WORLD_W / 2, WORLD_H / 2);
  }

  // ---------- Loop principal ----------
  update(time, dtMs) {
    const dt = dtMs / 1000;

    // 1) Movimiento local (teclado manda sobre el click)
    let vx = 0, vy = 0;
    const typing = document.activeElement === chatInput;
    if (!typing) {
      const k = this.keys;
      if (k.A.isDown || k.LEFT.isDown) vx -= 1;
      if (k.D.isDown || k.RIGHT.isDown) vx += 1;
      if (k.W.isDown || k.UP.isDown) vy -= 1;
      if (k.S.isDown || k.DOWN.isDown) vy += 1;
    }

    if (vx || vy) {
      if (this.target) { this.target = null; this.clearDestMarker(); }
      const len = Math.hypot(vx, vy);
      this.tryMove((vx / len) * SPEED * dt, (vy / len) * SPEED * dt);
    } else if (this.target) {
      const dx = this.target.x - this.me.x;
      const dy = this.target.y - this.me.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 6) {
        this.target = null;
        this.moving = false;
        this.clearDestMarker();
      } else {
        const step = Math.min(SPEED * dt, dist);
        this.tryMove((dx / dist) * step, (dy / dist) * step);
      }
    } else {
      this.moving = false;
    }

    this.me.moving = this.moving;
    this.renderAvatar(this.me, dtMs);

    // 2) Enviar posición al servidor (throttle + solo si cambió)
    if (this.online && this.room && time - this.lastSent > MOVE_SEND_MS) {
      const stateStr = `${this.me.x | 0},${this.me.y | 0},${this.me.flip},${this.moving},${this.me.dir}`;
      if (stateStr !== this.lastSentState) {
        this.room.send("move", {
          x: this.me.x, y: this.me.y,
          flip: this.me.flip, moving: this.moving, dir: this.me.dir,
        });
        this.lastSentState = stateStr;
        this.lastSent = time;
      }
    }

    // 3) Sincronizar jugadores remotos (diff del estado)
    if (this.online && this.room) {
      const seen = new Set();
      this.room.state.players.forEach((p, id) => {
        if (id === this.room.sessionId) {
          // HUD con score validado por el servidor
          if (p.score !== this.score) {
            this.score = p.score;
            document.getElementById("coin-count").textContent = this.score;
          }
          return;
        }
        seen.add(id);
        let a = this.remotes.get(id);
        if (!a) {
          a = this.makeAvatar(p.x, p.y, p.name, false);
          this.remotes.set(id, a);
        }
        a.tx = p.x; a.ty = p.y;
        a.flip = !!p.flip;
        a.moving = !!p.moving;
        a.dir = p.dir || "down";
      });
      for (const [id, a] of this.remotes) {
        if (!seen.has(id)) { this.destroyAvatar(a); this.remotes.delete(id); }
      }
      // Interpolación suave hacia la última posición conocida
      for (const a of this.remotes.values()) {
        const f = Math.min(1, dt * 12);
        a.x += (a.tx - a.x) * f;
        a.y += (a.ty - a.y) * f;
        const isFar = Math.hypot(a.tx - a.x, a.ty - a.y) > 2;
        a.moving = a.moving || isFar;
        this.renderAvatar(a, dtMs);
      }

      // 4) Monedas del servidor (diff)
      const seenCoins = new Set();
      this.room.state.coins.forEach((c, id) => {
        seenCoins.add(id);
        if (!this.coinSprites.has(id)) {
          this.coinSprites.set(id, this.makeCoinSprite(c.x, c.y));
        }
      });
      for (const [id, s] of this.coinSprites) {
        if (!seenCoins.has(id)) { s.destroy(); this.coinSprites.delete(id); }
      }
      // Animación + intento de recolección
      for (const [id, s] of this.coinSprites) {
        s.y = s.baseY + Math.sin(time * 0.004 + s.phase) * 6;
        if (Math.hypot(s.x - this.me.x, s.baseY - this.me.y) < PICKUP_DIST) {
          this.room.send("collect", { id });
        }
      }
    } else {
      // Modo offline: monedas locales
      for (const s of [...this.offlineCoins]) {
        s.y = s.baseY + Math.sin(time * 0.004 + s.phase) * 6;
        if (Math.hypot(s.x - this.me.x, s.baseY - this.me.y) < PICKUP_DIST) {
          this.offlineCoins = this.offlineCoins.filter((c) => c !== s);
          this.collectFx(s, true);
          this.time.delayedCall(1200, () => this.spawnOfflineCoin());
        }
      }
    }

    // 5) Contador de conectados
    if (this.online && this.room) {
      const n = this.room.state.players.size;
      document.getElementById("online-text").textContent =
        n === 1 ? "1 conectado" : `${n} conectados`;
    }
  }

  tryMove(dx, dy) {
    const nx = this.me.x + dx;
    const ny = this.me.y + dy;
    let movedAny = false;
    if (isWalkable(nx, this.me.y)) { this.me.x = nx; movedAny = true; }
    if (isWalkable(this.me.x, ny)) { this.me.y = ny; movedAny = true; }

    // Si la fuente bloquea el camino, deslizarse tangencialmente a su alrededor
    if (!movedAny && this.target) {
      const fx = this.me.x - FOUNTAIN.x, fy = this.me.y - FOUNTAIN.y;
      const flen = Math.hypot(fx, fy) || 1;
      // dos tangentes posibles; elegir la que acerque al objetivo
      const step = Math.hypot(dx, dy);
      const t1 = { x: -fy / flen * step, y: fx / flen * step };
      const t2 = { x: fy / flen * step, y: -fx / flen * step };
      const d1 = Math.hypot(this.me.x + t1.x - this.target.x, this.me.y + t1.y - this.target.y);
      const d2 = Math.hypot(this.me.x + t2.x - this.target.x, this.me.y + t2.y - this.target.y);
      const t = d1 < d2 ? t1 : t2;
      if (isWalkable(this.me.x + t.x, this.me.y + t.y)) {
        this.me.x += t.x; this.me.y += t.y;
        dx = t.x; dy = t.y;
        movedAny = true;
      }
    }

    // Dirección de la vista según el vector dominante
    if (movedAny && (dx || dy)) {
      if (Math.abs(dx) > Math.abs(dy) * 0.9) {
        this.me.dir = "side";
        this.me.flip = dx < 0;
      } else {
        this.me.dir = dy < 0 ? "up" : "down";
      }
    }
    this.moving = movedAny;
    if (!movedAny) { this.target = null; this.clearDestMarker(); }
  }
}

const chatInput = document.getElementById("chat-input");
let scene = null;

document.getElementById("enter-btn").addEventListener("click", start);
document.getElementById("player-name").addEventListener("keydown", (e) => {
  if (e.key === "Enter") start();
});

function start() {
  const v = document.getElementById("player-name").value.trim();
  if (v) playerName = v;
  document.getElementById("welcome").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("brand").style.display = "block";
  document.getElementById("online-badge").style.display = "flex";
  document.getElementById("chat-bar").style.display = "flex";

  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: "game-container",
    backgroundColor: "#0A0A23",
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
    scene: PlazaScene,
  });
  game.events.on("ready", () => { scene = game.scene.getScene("plaza"); });

  // Chat: Enter dentro del input envía; Enter fuera enfoca el chat
  chatInput.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") {
      const s = window.__plaza;
      if (s) s.sendChat(chatInput.value);
      chatInput.value = "";
      chatInput.blur();
    }
    if (e.key === "Escape") chatInput.blur();
  });
  document.getElementById("chat-send").addEventListener("click", () => {
    const s = window.__plaza;
    if (s) s.sendChat(chatInput.value);
    chatInput.value = "";
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.activeElement !== chatInput) {
      chatInput.focus();
    }
  });
}
